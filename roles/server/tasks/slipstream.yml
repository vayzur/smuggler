---
- name: Download slipstream-server binary
  get_url:
    url: "{{ slipstream_server_binary_url }}"
    dest: /usr/local/bin/slipstream-server
    mode: 0755
  tags:
    - slipstream-server-binary

- name: Install openssl
  package:
    name: openssl
    state: present

- name: Check slipstream keys on controller
  stat:
    path: "{{ controller_keys_path }}/{{ slipstream_privkey }}"
  register: slipstream_keys
  delegate_to: localhost
  become: false
  tags:
    - slipstream-keys

- name: Generate slipstream keys
  shell: |
    openssl req -x509 -newkey rsa:2048 -nodes -keyout {{ keys_path }}/{{ slipstream_privkey }} -out {{ keys_path }}/{{ slipstream_pubkey }} -days 365 -subj "/CN=slipstream"
  when: 
    - not slipstream_keys.stat.exists
    - tunnels | selectattr('engine', 'equalto', 'slipstream') | map(attribute='server_node') | list | first == inventory_hostname
  tags:
    - slipstream-keys

- name: Fetch slipstream keys to localhost
  fetch:
    src: "{{ item }}"
    dest: "{{ controller_keys_path }}/{{ item | basename }}"
    flat: true
  loop:
    - "{{ keys_path }}/{{ slipstream_privkey }}"
    - "{{ keys_path }}/{{ slipstream_pubkey }}"
  when: 
    - not slipstream_keys.stat.exists
    - tunnels | selectattr('engine', 'equalto', 'slipstream') | map(attribute='server_node') | list | first == inventory_hostname
  tags:
    - slipstream-keys

- name: Copy slipstream pubkey
  copy:
    src: "{{ controller_keys_path }}/{{ slipstream_pubkey }}"
    dest: "{{ keys_path }}/{{ slipstream_pubkey }}"
    mode: 0644
  tags:
    - slipstream-keys

- name: Copy slipstream privkey
  copy:
    src: "{{ controller_keys_path }}/{{ slipstream_privkey }}"
    dest: "{{ keys_path }}/{{ slipstream_privkey }}"
    mode: 0600
  tags:
    - slipstream-keys
