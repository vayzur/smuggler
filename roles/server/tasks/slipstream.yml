---
- name: Copy slipstream-server
  copy:
    src: slipstream-server
    dest: /usr/local/bin/slipstream-server
    mode: 0755
  tags:
    - slipstream-server-binary

- name: Install openssl
  package:
    name: openssl
    state: present

- name: Detect mimalloc package
  shell: |
    apt-cache search '^libmimalloc[0-9]' | awk '{ print $1 }' | head -n1
  register: mimalloc_pkg
  changed_when: false
  when: slipstream_mimalloc and ansible_os_family == "Debian"

- name: Install mimalloc
  apt:
    name: "{{ mimalloc_pkg.stdout }}"
    state: present
    update_cache: true
  when: slipstream_mimalloc and ansible_os_family == "Debian"

- name: Detect mimalloc path
  shell: ldconfig -p | grep mimalloc | awk '{ print $NF }'
  register: mimalloc_path
  changed_when: false
  when: slipstream_mimalloc
  tags:
    - server-tunnels

- name: Fail if mimalloc not found
  fail:
    msg: "mimalloc not found"
  when: slipstream_mimalloc and mimalloc_path.stdout == ""
  tags:
    - server-tunnels

- name: Check slipstream keys on controller
  stat:
    path: "/tmp/{{ slipstream_privkey }}"
  register: slipstream_keys
  delegate_to: localhost
  become: false
  tags:
    - slipstream-keys

- name: Generate slipstream keys
  shell: |
    openssl req -x509 -newkey rsa:2048 -nodes -keyout {{ keys_path }}/{{ slipstream_privkey }} -out {{ keys_path }}/{{ slipstream_pubkey }} -days 365 -subj "/CN=slipstream"
  when: not slipstream_keys.stat.exists
  throttle: 1
  tags:
    - slipstream-keys

- name: Fetch slipstream keys to localhost
  fetch:
    src: "{{ item }}"
    dest: "/tmp/{{ item | basename }}"
    flat: true
  loop:
    - "{{ keys_path }}/{{ slipstream_privkey }}"
    - "{{ keys_path }}/{{ slipstream_pubkey }}"
  when: not slipstream_keys.stat.exists
  throttle: 1
  tags:
    - slipstream-keys

- name: Copy slipstream pubkey
  copy:
    src: "/tmp/{{ slipstream_pubkey }}"
    dest: "{{ keys_path }}/{{ slipstream_pubkey }}"
    mode: 0644
  tags:
    - slipstream-keys

- name: Copy slipstream privkey
  copy:
    src: "/tmp/{{ slipstream_privkey }}"
    dest: "{{ keys_path }}/{{ slipstream_privkey }}"
    mode: 0600
  tags:
    - slipstream-keys
