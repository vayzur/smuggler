---
- import_tasks: dnstt.yml
  when: smuggler_engines | intersect(['dnstt']) | length > 0
  tags:
    - dnstt-client

- import_tasks: slipstream.yml
  when: smuggler_engines | intersect(['slipstream']) | length > 0
  tags:
    - slipstream-client

- import_tasks: vaydns.yml
  when: smuggler_engines | intersect(['vaydns']) | length > 0
  tags:
    - vaydns-client

- name: Check if any tunnel has health check enabled
  set_fact:
    health_check_needed: "{{ smuggler_tunnels | selectattr('client.health_check.enabled', 'defined') | selectattr('client.health_check.enabled') | list | length > 0 }}"
  tags:
    - client-health-check

- name: Deploy health check script
  template:
    src: health-smuggler.sh.j2
    dest: "/opt/health-smuggler.sh"
    mode: 0755
    owner: root
    group: root
  when: health_check_needed | bool
  tags:
    - client-health-check

- name: Deploy health check services
  template:
    src: health-smuggler@.service.j2
    dest: "/etc/systemd/system/health-smuggler@{{ tun.name }}.service"
    mode: 0644
    owner: root
    group: root
  loop: "{{ smuggler_tunnels }}"
  loop_control:
    loop_var: tun
    index_var: tun_idx
  when: tun.client.health_check.enabled | default(false) | bool
  tags:
    - client-health-check

- name: Deploy health check timers
  template:
    src: health-smuggler@.timer.j2
    dest: "/etc/systemd/system/health-smuggler@{{ tun.name }}.timer"
    mode: 0644
    owner: root
    group: root
  loop: "{{ smuggler_tunnels }}"
  loop_control:
    loop_var: tun
  when: tun.client.health_check.enabled | default(false) | bool
  tags:
    - client-health-check

- name: Deploy tunnel systemd service
  template:
    src: smuggler@.service.j2
    dest: "/etc/systemd/system/smuggler@{{ tun.name }}.service"
    mode: 0644
    owner: root
    group: root
  loop: "{{ smuggler_tunnels }}"
  loop_control:
    loop_var: tun
  tags:
    - client-tunnels
    - client-services

- name: Reload systemd daemon
  systemd:
    daemon_reload: true
  changed_when: true
  tags:
    - client-tunnels
    - client-health-check
    - client-services

- name: Enable and start tunnel services
  systemd:
    name: "smuggler@{{ tun.name }}"
    enabled: true
    state: restarted
  loop: "{{ smuggler_tunnels }}"
  loop_control:
    loop_var: tun
  tags:
    - client-tunnels

- name: Enable and start health check timers
  systemd:
    name: "health-smuggler@{{ tun.name }}.timer"
    enabled: true
    state: restarted
  loop: "{{ smuggler_tunnels }}"
  loop_control:
    loop_var: tun
  when: tun.client.health_check.enabled | default(false) | bool
  tags:
    - client-health-check
