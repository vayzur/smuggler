---
- import_tasks: dnstt.yml
  when: smuggler_engines | intersect(['dnstt']) | length > 0
  tags:
    - dnstt-client

- import_tasks: slipstream.yml
  when: smuggler_engines | intersect(['slipstream']) | length > 0
  tags:
    - slipstream-client

- name: Make health check script
  template:
    src: health-smuggler.sh.j2
    dest: "/opt/health-smuggler.sh"
    mode: 0755
    owner: root
    group: root
  tags:
    - client-health-check

- name: Make health check services
  template:
    src: health-smuggler@.service.j2
    dest: "/etc/systemd/system/health-smuggler@{{ tun.name }}.service"
    mode: 0644
    owner: root
    group: root
  loop: "{{ smuggler_tunnels }}"
  loop_control:
    loop_var: tun
    index_var: tun_idx
  when: tun.client.health_check.enabled | default(false) | bool
  tags:
    - client-health-check

- name: Make health check timers
  template:
    src: health-smuggler@.timer.j2
    dest: "/etc/systemd/system/health-smuggler@{{ tun.name }}.timer"
    mode: 0644
    owner: root
    group: root
  loop: "{{ smuggler_tunnels }}"
  loop_control:
    loop_var: tun
  when: tun.client.health_check.enabled | default(false) | bool
  tags:
    - client-health-check

- name: Make systemd service
  template:
    src: smuggler@.service.j2
    dest: "/etc/systemd/system/smuggler@{{ tun.name }}.service"
    mode: 0644
    owner: root
    group: root
  loop: "{{ smuggler_tunnels }}"
  loop_control:
    loop_var: tun
  tags:
    - client-tunnels

- name: Reload systemd
  systemd:
    daemon_reload: true
  changed_when: true
  tags:
    - client-tunnels
    - client-health-check

- name: Enable and start tunnel services
  systemd:
    name: "smuggler@{{ tun.name }}"
    enabled: true
    state: restarted
  loop: "{{ smuggler_tunnels }}"
  loop_control:
    loop_var: tun
  tags:
    - client-tunnels

- name: Enable and start health check timers
  systemd:
    name: "health-smuggler@{{ tun.name }}.timer"
    enabled: true
    state: restarted
  loop: "{{ smuggler_tunnels }}"
  loop_control:
    loop_var: tun
  when: tun.client.health_check.enabled | default(false) | bool
  tags:
    - client-health-check
