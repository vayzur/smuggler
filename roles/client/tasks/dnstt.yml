---
- name: Download dnstt-client binary
  get_url:
    url: "https://github.com/0xAFz/dnstt/releases/download/latest/dnstt-client-linux-amd64"
    dest: /usr/local/bin/dnstt-client
    mode: 0755
  tags:
    - dnstt-client-binary

- name: Copy dnstt public key
  copy:
    src: "/tmp/{{ dnstt_pubkey }}"
    dest: "{{ keys_path }}/{{ dnstt_pubkey }}"
    mode: 0644
  tags:
    - dnstt-keys
