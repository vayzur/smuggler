---
- name: Generate SSH keys
  command: >
    ssh-keygen -t ed25519 -f {{ ansible_user_dir }}/.ssh/{{ ssh_privkey }} -N "" -q
  args:
    creates: "{{ ansible_user_dir }}/.ssh/{{ ssh_privkey }}"

- name: Add public key to authorized_keys
  authorized_key:
    user: "{{ ansible_user }}"
    key: "{{ lookup('file', ansible_user_dir + '/.ssh/' + ssh_privkey + '.pub') }}"
    state: present

- name: Deploy SSH proxy systemd service
  template:
    src: proxy@.service.j2
    dest: "/etc/systemd/system/proxy@{{ item.0.name }}-{{ item.1.name }}.service"
    mode: 0644
    owner: root
    group: root
  loop: "{{ smuggler_tunnels | subelements('server.proxy', skip_missing=True) }}"
  register: units_result
  tags:
    - proxy-services
  
- name: Reload systemd daemon
  systemd:
    daemon_reload: true
  when: units_result.changed
  tags:
    - proxy-services

- name: Enable and start SSH proxy services
  systemd:
    name: "proxy@{{ item.0.name }}-{{ item.1.name }}.service"
    enabled: true
    state: restarted
  loop: "{{ smuggler_tunnels | subelements('server.proxy', skip_missing=True) }}"
  tags:
    - proxy-services
