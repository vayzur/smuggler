---
- name: Ensure sysctl.d directory exists
  file:
    path: /etc/sysctl.d
    state: directory
    owner: root
    group: root
    mode: 0755

- name: Deploy smuggler sysctl settings
  template:
    src: sysctl.conf.j2
    dest: /etc/sysctl.d/90-smuggler.conf
  changed_when: true
  notify:
    - Reload sysctl
