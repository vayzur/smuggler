---
# Traffic load balancer - distributes client traffic across multiple tunnels
# lb: false
# lb_policy: "hash" # Options: hash, roundrobin, random
# lb_ports:
#   - "8080"
#   - "10000-10200"

# DNS load balancer - distributes DNS queries across multiple resolvers
# dnsdist: false

# dnsdist_bind_addr: "127.0.0.1"
# dnsdist_bind_port: 5300

# ACL configuration
# dnsdist_acl:
  # - "127.0.0.0/8"
  # - "10.0.0.0/8"
  # - "100.64.0.0/10"
  # - "169.254.0.0/16"
  # - "192.168.0.0/16"
  # - "172.16.0.0/12"
  # - "::1/128"
  # - "fc00::/7"
  # - "fe80::/10"

# Upstream DNS servers
# dnsdist_upstream_servers:
#   - address: "8.8.8.8:53"
#   - address: "8.8.4.4:53"

# Load balancing policy
# leastOutstanding is ideal for client-side DNS tunnel load balancing
# spreads new tunnel connections across resolvers based on active query count
# naturally avoids overloaded or slow resolvers without manual intervention
# Options: leastOutstanding, roundrobin, firstAvailable, wrandom, chashed, whashed
# dnsdist_server_policy: "leastOutstanding"

# Performance
# dnsdist_udp_timeout: 2
# dnsdist_max_udp_outstanding: 65535
# dnsdist_tcp_recv_timeout: 2
# dnsdist_tcp_send_timeout: 2

# Prometheus metrics
# dnsdist_metrics: false
# dnsdist_metrics_bind_addr: "127.0.0.1"
# dnsdist_metrics_bind_port: 8083
# dnsdist_metrics_require_auth: false
# dnsdist_metrics_password: "admin"
# dnsdist_metrics_api_key: ""
# dnsdist_metrics_acl:
#   - "0.0.0.0/0"
#   - "::/0"

# Console
# dnsdist_console: false
# dnsdist_control_socket: "127.0.0.1:5199"
# dnsdist_console_key: "NTNPTQsE5e1LL5W0zPpqepXrg+HmzNSmgcqlzgqjz2g="
