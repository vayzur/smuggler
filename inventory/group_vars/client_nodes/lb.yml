## Master switch for all load balancing features
load_balancing: false

# Traffic load balancer - distributes client traffic across multiple tunnel servers
lb:
  enabled: false        # Enable traffic LB (requires load_balancing: true)
  type: "hash"          # Options: hash, random, roundrobin
  ports:                # Ports to load balance
    # - "80"
    # - "8080"
    # - "8880"
    # - "2052"
    # - "2082"
    # - "2086"
    # - "2095"
    # - "443"
    # - "2053"
    # - "2083"
    # - "2087"
    # - "2096"
    # - "8443"
    # - "9200-9400"
    - "10000-10200"

# DNS load balancer - distributes DNS queries across multiple resolvers
dns_lb:
  enabled: false        # Enable DNS LB (requires load_balancing: true)
  type: "roundrobin"    # Options: hash, random, roundrobin
  resolvers:             # List of DNS resolvers
    - "1.1.1.1"
    - "8.8.8.8"
    - "9.9.9.9"
