---
tunnels:
  - name: tun0
    client_node: lb0
    server_node: node0
    engine: dnstt
    domain: d.domain.tld
    client:
      lb:
        enabled: false
        backup_addr: 127.0.0.1
        backup_port: 2053
      health_check:
        enabled: true # Requires a local proxy to check End-to-End connection
        proxy_type: http
        proxy_addr: 127.0.0.1
        proxy_port: 10001
        test_url: "http://www.google.com/gen_204"
        timeout: 5
      dns_protocol: udp # udp, doh, dot
      dns_resolver: "1.1.1.1:53"
      bind_addr: 0.0.0.0
      bind_port: 2052
    server:
      bind_addr: "{{ ansible_default_ipv4.address }}"
      bind_port: 53
      target_addr: 127.0.0.1
      target_port: 2052
      mtu: 493
      proxy:
        - name: p1
          remote_host: 127.0.0.1
          remote_port: 22

  - name: tun1
    client_node: lb0
    server_node: node0
    engine: slipstream
    domain: d.domain.tld
    client:
      lb:
        enabled: false
        backup_addr: 127.0.0.1
        backup_port: 2053
      health_check:
        enabled: true # Requires a local proxy to check End-to-End connection
        proxy_type: http
        proxy_addr: 127.0.0.1
        proxy_port: 10002
        test_url: "http://www.google.com/gen_204"
        timeout: 5
      dns_resolver:
        - "1.1.1.1:53"
        - "8.8.8.8:53"
        - "9.9.9.9:53"
      bind_addr: 0.0.0.0
      bind_port: 2052
      keep_alive_interval: 200
    server:
      bind_addr: "{{ ansible_default_ipv4.address }}"
      bind_port: 53
      target_addr: 127.0.0.1
      target_port: 2052
      max_connections: 256
      proxy:
        - name: p1
          remote_host: 127.0.0.1
          remote_port: 22

  - name: tun2
    client_node: lb0
    server_node: node0
    engine: dnstt-revived
    domain: d.domain.tld
    client:
      lb:
        enabled: false
        backup_addr: 127.0.0.1
        backup_port: 2053
      health_check:
        enabled: true # Requires a local proxy to check End-to-End connection
        proxy_type: http
        proxy_addr: 127.0.0.1
        proxy_port: 10003
        test_url: "http://www.google.com/gen_204"
        timeout: 5
      dns_protocol: udp # udp, doh, dot
      dns_resolver: "1.1.1.1:53"
      bind_addr: 0.0.0.0
      bind_port: 2052
      max_num_labels: 2
      max_qname_len: 101
      rps: 0
      udp_workers: 100
      loglevel: "warning"
    server:
      bind_addr: "{{ ansible_default_ipv4.address }}"
      bind_port: 53
      target_addr: 127.0.0.1
      target_port: 2052
      mtu: 493
      loglevel: "warning"
      proxy:
        - name: p1
          remote_host: 127.0.0.1
          remote_port: 22
