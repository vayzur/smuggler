---
tunnels:
  - name: t00
    server_node: node0
    client_node: lb0
    engine: slipstream
    domain: t0.example.com
    client:
      lb:
        enabled: true
        backup_addr: 127.0.0.1
        backup_port: 2051
      health_check:
        enabled: true
        interval: "5s"
        timeout: 3
        proxy_type: socks5
        proxy_user: hello
        proxy_pass: world
        proxy_addr: 127.0.0.1
        proxy_port: 2050
        test_url: "http://www.google.com/gen_204"
      dns_resolver: "127.0.0.1:5300"
      bind_addr: 127.0.0.1
      bind_port: 2050
      keep_alive_interval: 200
    server:
      killer:
        enabled: true
        interval: 30min
      bind_addr: 127.0.0.1
      bind_port: 8200
      target_port: 1080
      max_connections: 8192
      idle_timeout_seconds: 60

  - name: t01
